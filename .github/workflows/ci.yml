name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore UserService/UserService.Tests/UserService.Tests.csproj

      - name: Build
        run: dotnet build UserService/UserService.Tests/UserService.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test UserService/UserService.Tests/UserService.Tests.csproj --configuration Release --no-build